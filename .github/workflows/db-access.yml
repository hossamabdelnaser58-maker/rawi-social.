name: PostgreSQL access tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Set up disposable database and minimal auth fixtures
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users(id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          grant usage on schema auth to authenticated;
          insert into auth.users values ('00000000-0000-0000-0000-000000000001'), ('00000000-0000-0000-0000-000000000002');
          SQL
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Verify private posts and follow access using two identities
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',false);
          insert into public.profiles(id,username,display_name,is_private) values (auth.uid(),'owner_one','Owner',true);
          insert into public.posts(body) values ('Access test');
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000002',false);
          insert into public.profiles(id,username,display_name) values (auth.uid(),'other_two','Other');
          do $$ begin if exists(select from public.posts) then raise exception 'Private post visible to non-follower'; end if; end $$;
          insert into public.follows(follower_id,followed_id) values (auth.uid(),'00000000-0000-0000-0000-000000000001');
          do $$ begin if exists(select from public.posts) then raise exception 'Private post visible to pending follower'; end if; end $$;
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',false);
          update public.follows set accepted=true where followed_id=auth.uid();
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000002',false);
          do $$ begin if not exists(select from public.posts) then raise exception 'Accepted follower cannot read post'; end if; end $$;
          insert into public.likes(post_id) select id from public.posts;
          insert into public.comments(post_id,body) select id,'Access test comment' from public.posts;
          do $$ begin if (select count(*) from public.likes) <> 1 or (select count(*) from public.comments) <> 1 then raise exception 'Reaction or comment was not persisted'; end if; end $$;
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',false);
          insert into public.blocks(blocker_id,blocked_id) values (auth.uid(),'00000000-0000-0000-0000-000000000002');
          select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000002',false);
          do $$ begin if exists(select from public.posts) or exists(select from public.follows) then raise exception 'Block did not revoke access'; end if; end $$;
          SQL
